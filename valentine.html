<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      padding: 30px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      position: relative;
      width: 320px;
    }

    h1 {
      color: #e63946;
      margin-bottom: 25px;
    }

    button {
      font-size: 16px;
      padding: 10px 22px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
    }

    #yes {
      background: #38b000;
      color: white;
      margin-right: 15px;
    }

    #no {
      background: #e63946;
      color: white;
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Will you be my Valentine Samik ? 💘</h1>
    <button id="yes" onclick="yesClicked()">Yes 💕</button>
    <button id="no">No 💔</button>
  </div>

  <script>
    const noBtn = document.getElementById("no");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 120 - 60;

      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    function yesClicked() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          font-family:Arial;
          background:linear-gradient(135deg,#ff9a9e,#fad0c4);
          text-align:center;">
          <h1 style="color:#e63946;">
            YAY!!! 💖🥰<br>
            I knew you’d say yes! 💍💘
          </h1>
        </div>`;
    }
  </script>

</body>
</html>
